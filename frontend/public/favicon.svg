<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SGPA">
  <!--
    Icono del SGPA: la balanza de la justicia en el dorado de la marca.
    Sustituye al logotipo morado de terceros que venía del andamiaje inicial.
    Fondo oscuro propio para que se lea en las pestañas claras del navegador.
  -->
  <rect width="64" height="64" rx="14" fill="#0F0F0F"/>

  <g stroke="#DFB971" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Mástil y base -->
    <path d="M32 17v33"/>
    <path d="M22 50h20"/>
    <!-- Brazo -->
    <path d="M13 22h38"/>
    <!-- Cuerdas de los platillos -->
    <path d="M13 22l-5 11"/>
    <path d="M13 22l5 11"/>
    <path d="M51 22l-5 11"/>
    <path d="M51 22l5 11"/>
    <!-- Platillos -->
    <path d="M8 33h10"/>
    <path d="M46 33h10"/>
  </g>

  <!-- Pomo superior -->
  <circle cx="32" cy="14" r="3.4" fill="#DFB971"/>
</svg>
